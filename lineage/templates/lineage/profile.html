<div id="profileModal" class="fixed inset-0 z-[120] flex items-center justify-center hidden bg-slate-900/60 backdrop-blur-md p-4 transition-all duration-300 opacity-0">
    <div id="profileContent" class="bg-white dark:bg-slate-900 w-full max-w-xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col transform scale-90 opacity-0 transition-all duration-300 ease-out">
        
        <div class="p-8 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-indigo-50/50 dark:bg-indigo-900/10">
            <div>
                <h3 class="text-2xl font-black text-slate-900 dark:text-white">Member Profile</h3>
                <p class="text-indigo-600 font-bold uppercase text-[10px] tracking-widest">Personal Identification</p>
            </div>
            <button onclick="closeProfile()" class="h-10 w-10 rounded-full bg-white dark:bg-slate-800 flex items-center justify-center text-slate-400 hover:text-red-500 transition-all">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="p-8 overflow-y-auto max-h-[75vh] scrollbar-hide">
            <div class="flex flex-col items-center mb-8">
                <div id="prof-photo-container" class="h-32 w-32 rounded-3xl bg-indigo-600 text-white flex items-center justify-center overflow-hidden border-4 border-white dark:border-slate-700 shadow-xl mb-4 transform transition-all duration-700 scale-50 opacity-0 prof-item">
                    <img id="prof-photo" src="" class="h-full w-full object-cover hidden">
                    <span id="prof-initial" class="text-4xl font-black"></span>
                </div>
                <h2 id="prof-fullname" class="text-3xl font-black text-slate-800 dark:text-white transform transition-all duration-500 translate-y-4 opacity-0 prof-item">---</h2>
                <div id="prof-status-badge" class="mt-2 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-slate-100 text-slate-600 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">---</div>
            </div>

            <div class="grid grid-cols-2 gap-y-6 gap-x-6">
                <div class="space-y-1 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Birth Date</p>
                    <p id="prof-birth" class="font-bold text-slate-700 dark:text-slate-200">---</p>
                </div>
                <div class="space-y-1 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Gender</p>
                    <p id="prof-gender" class="font-bold text-slate-700 dark:text-slate-200 capitalize">---</p>
                </div>
                <div class="space-y-1 border-t dark:border-slate-800 pt-4 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Father</p>
                    <p id="prof-father" class="font-bold text-slate-700 dark:text-slate-200">---</p>
                </div>
                <div class="space-y-1 border-t dark:border-slate-800 pt-4 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Mother</p>
                    <p id="prof-mother" class="font-bold text-slate-700 dark:text-slate-200">---</p>
                </div>
                <div class="space-y-1 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Spouse</p>
                    <p id="prof-spouse" class="font-bold text-slate-700 dark:text-slate-200">---</p>
                </div>
                <div class="space-y-1 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Job Status</p>
                    <p id="prof-job" class="font-bold text-slate-700 dark:text-slate-200">---</p>
                </div>
                <div class="col-span-2 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 transform transition-all duration-500 translate-y-4 opacity-0 prof-item">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Health & Disability Status</p>
                    <p id="prof-disability" class="font-bold text-slate-700 dark:text-slate-200">---</p>
                </div>
            </div>
        </div>
    </div>
</div>
